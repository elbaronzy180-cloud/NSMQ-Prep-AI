<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Model Lab</title>
  <meta name="description" content="A personal tool for understanding how a small language model trains.">

  <!-- Makes the page installable on a phone's home screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Runs before the page paints so the saved theme shows with no flash -->
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/training" aria-label="Model Lab home">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span>Model Lab</span>
    </a>

    <nav class="nav" aria-label="Main">
      <a href="#/training" data-route="training">Training</a>
      <a href="#/playground" data-route="playground">Playground</a>
      <a href="#/learn" data-route="learn">Learn</a>
      <a href="#/settings" data-route="settings">Settings</a>
    </nav>

    <div class="actions">
      <button id="help-btn" class="btn btn-soft" type="button">What am I looking at?</button>
      <button id="theme-btn" class="btn btn-icon" type="button" aria-label="Switch light or dark mode">◐</button>
    </div>
  </header>

  <!-- Each page draws itself into this element -->
  <main id="page" class="page" tabindex="-1"></main>

  <!-- The popup used by every "What am I looking at?" button -->
  <dialog id="help-dialog" class="dialog" aria-labelledby="help-title">
    <h2 id="help-title"></h2>
    <div id="help-body"></div>
    <form method="dialog"><button class="btn btn-primary">Got it</button></form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
