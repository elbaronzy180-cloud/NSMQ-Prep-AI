<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Model Lab</title>
  <meta name="description" content="A personal tool for understanding how a small language model trains.">

  <!-- Makes the page installable on a phone's home screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Runs before the page paints so the saved theme shows with no flash -->
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/training" aria-label="Model Lab home">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span>Model Lab</span>
    </a>

    <nav class="nav" aria-label="Main">
      <!-- Each link has a small icon (drawn with SVG, so it takes the text colour) -->
      <a href="#/training" data-route="training">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 3 8-9"/><path d="M3 21h18"/></svg>
        <span>Training</span></a>
      <a href="#/playground" data-route="playground">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 012 2v9a2 2 0 01-2 2h-7l-5 4v-4H5a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>
        <span>Playground</span></a>
      <a href="#/learn" data-route="learn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v16H6.5A2.5 2.5 0 004 21.5z"/><path d="M4 21.5V5.5"/></svg>
        <span>Learn</span></a>
      <a href="#/settings" data-route="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        <span>Settings</span></a>
    </nav>

    <div class="actions">
      <button id="help-btn" class="btn btn-soft" type="button">What am I looking at?</button>
      <button id="theme-btn" class="btn btn-icon" type="button" aria-label="Switch light or dark mode">◐</button>
    </div>
  </header>

  <!-- Each page draws itself into this element -->
  <main id="page" class="page" tabindex="-1"></main>

  <!-- The popup used by every "What am I looking at?" button -->
  <dialog id="help-dialog" class="dialog" aria-labelledby="help-title">
    <h2 id="help-title"></h2>
    <div id="help-body"></div>
    <form method="dialog"><button class="btn btn-primary">Got it</button></form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
